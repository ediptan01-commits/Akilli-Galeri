<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport"
      content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

<title>Cep Bağlama</title>

<style>
* {
    box-sizing: border-box;
    -webkit-tap-highlight-color: transparent;
}

body {
    margin: 0;
    background: #111;
    color: #fff;
    font-family: Arial, sans-serif;
    overflow-x: hidden;
    touch-action: manipulation;
}

header {
    height: 64px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    padding: 0 18px;
    background: linear-gradient(135deg,#25170e,#4d2b13);
    border-bottom: 1px solid #68401e;
}

.logo {
    font-size: 21px;
    font-weight: bold;
}

.subtitle {
    font-size: 11px;
    color: #d6b58a;
    margin-top: 3px;
}

button {
    border: 0;
    color: white;
    background: #613914;
    border-radius: 12px;
    padding: 10px 14px;
    font-size: 14px;
}

button:active {
    transform: scale(.96);
}

.controls {
    display: flex;
    gap: 8px;
    padding: 12px;
    overflow-x: auto;
    background: #191919;
}

.control {
    min-width: 105px;
    background: #242424;
    border: 1px solid #383838;
    border-radius: 12px;
    padding: 9px;
}

.control-title {
    font-size: 11px;
    color: #aaa;
    margin-bottom: 6px;
}

select,
input[type=range] {
    width: 100%;
}

select {
    background: #333;
    color: white;
    border: 0;
    border-radius: 7px;
    padding: 6px;
}

#instrument {
    position: relative;
    width: 96%;
    max-width: 1100px;
    height: 480px;
    margin: 20px auto;
    background:
        radial-gradient(circle at 72% 50%,#9c5b27 0,#70401b 23%,transparent 24%),
        linear-gradient(90deg,#3b1e0c,#754017,#9b5a26,#6e3918,#3b1e0c);
    border-radius: 80px;
    box-shadow:
        0 15px 35px #000,
        inset 0 0 35px rgba(0,0,0,.7);
    overflow: hidden;
}

.neck {
    position: absolute;
    left: 0;
    top: 95px;
    width: 74%;
    height: 290px;
    background: linear-gradient(#8b5429,#633716,#8b5429);
    border-radius: 20px 80px 80px 20px;
    box-shadow: inset 0 0 15px #2a1205;
}

.body {
    position: absolute;
    right: 5%;
    top: 60px;
    width: 34%;
    height: 360px;
    border-radius: 48% 52% 50% 50%;
    background:
        radial-gradient(circle,#17100b 0 9%,#c37a37 10% 18%,#8b4b1d 19% 100%);
    box-shadow:
        inset 0 0 35px #301605,
        0 12px 25px #000;
}

.soundhole {
    position: absolute;
    left: 35%;
    top: 38%;
    width: 30%;
    height: 24%;
    border-radius: 50%;
    background: #080604;
    box-shadow: 0 0 0 9px #d28a43;
}

.strings {
    position: absolute;
    left: 3%;
    top: 105px;
    width: 93%;
    height: 270px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    z-index: 5;
}

.string {
    position: relative;
    height: 22px;
    cursor: pointer;
}

.line {
    position: absolute;
    left: 0;
    right: 0;
    top: 10px;
    height: 2px;
    background: #e2d4bd;
    box-shadow: 0 0 3px #fff;
    transition: .08s;
}

.string:active .line,
.string.hit .line {
    transform: scaleY(3);
    background: #fff2c7;
    box-shadow: 0 0 12px #fff;
}

.string-label {
    position: absolute;
    left: 7px;
    top: -4px;
    font-size: 10px;
    color: #ddd;
    opacity: .8;
}

.frets {
    position: absolute;
    left: 5%;
    top: 95px;
    width: 68%;
    height: 290px;
    z-index: 4;
    pointer-events: none;
}

.fret {
    position: absolute;
    top: 0;
    bottom: 0;
    width: 3px;
    background: rgba(235,200,150,.65);
}

.note {
    position: absolute;
    top: 0;
    bottom: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    color: rgba(255,255,255,.12);
    font-size: 10px;
}

.bottom-panel {
    width: 96%;
    max-width: 1100px;
    margin: 10px auto 25px;
    padding: 15px;
    background: #1d1d1d;
    border: 1px solid #333;
    border-radius: 15px;
}

#lastNote {
    text-align: center;
    font-size: 32px;
    font-weight: bold;
    color: #e2aa63;
}

#status {
    text-align: center;
    color: #999;
    margin-top: 5px;
}

.ritim-buttons {
    display: flex;
    justify-content: center;
    gap: 10px;
    margin-top: 12px;
}

.active {
    background: #a45e1b !important;
}

@media (max-width: 700px) {
    #instrument {
        height: 380px;
        border-radius: 60px;
    }

    .neck {
        top: 75px;
        height: 230px;
    }

    .body {
        top: 48px;
        height: 285px;
    }

    .soundhole {
        width: 35%;
        height: 25%;
    }

    .strings {
        top: 82px;
        height: 215px;
    }

    .frets {
        top: 75px;
        height: 230px;
    }
}

@media (orientation: landscape) and (max-height: 600px) {

    header {
        height: 50px;
    }

    #instrument {
        margin: 8px auto;
        height: calc(100vh - 150px);
        min-height: 300px;
    }

    .neck {
        top: 15%;
        height: 70%;
    }

    .body {
        top: 10%;
        height: 80%;
    }

    .strings {
        top: 17%;
        height: 66%;
    }

    .frets {
        top: 15%;
        height: 70%;
    }

    .bottom-panel {
        margin-top: 5px;
    }
}
</style>
</head>

<body>

<header>
    <div>
        <div class="logo">🎸 Cep Bağlama</div>
        <div class="subtitle">Dijital bağlama</div>
    </div>

    <button id="startBtn">🔊 Sesi Aç</button>
</header>

<div class="controls">

    <div class="control">
        <div class="control-title">Düzen</div>
        <select id="tuning">
            <option value="bozuk">Bozuk Düzen</option>
            <option value="baglama">Bağlama Düzeni</option>
            <option value="kara">Kara Düzen</option>
        </select>
    </div>

    <div class="control">
        <div class="control-title">Ses</div>
        <input id="volume" type="range" min="0" max="100" value="75">
    </div>

    <div class="control">
        <div class="control-title">Titreşim</div>
        <button id="vibration">Açık</button>
    </div>

    <div class="control">
        <div class="control-title">Ritim</div>
        <button id="ritim">Kapalı</button>
    </div>

</div>

<div id="instrument">

    <div class="neck"></div>

    <div class="body">
        <div class="soundhole"></div>
    </div>

    <div class="frets" id="frets"></div>

    <div class="strings">

        <div class="string" data-string="0">
            <div class="string-label">SOL</div>
            <div class="line"></div>
        </div>

        <div class="string" data-string="1">
            <div class="string-label">SOL</div>
            <div class="line"></div>
        </div>

        <div class="string" data-string="2">
            <div class="string-label">RE</div>
            <div class="line"></div>
        </div>

        <div class="string" data-string="3">
            <div class="string-label">RE</div>
            <div class="line"></div>
        </div>

        <div class="string" data-string="4">
            <div class="string-label">LA</div>
            <div class="line"></div>
        </div>

        <div class="string" data-string="5">
            <div class="string-label">LA</div>
            <div class="line"></div>
        </div>

        <div class="string" data-string="6">
            <div class="string-label">MI</div>
            <div class="line"></div>
        </div>

    </div>
</div>

<div class="bottom-panel">

    <div id="lastNote">—</div>
    <div id="status">Bağlamayı çalmak için bir tele dokun.</div>

    <div class="ritim-buttons">
        <button data-ritim="yavas">🐢 Yavaş</button>
        <button data-ritim="orta">▶ Orta</button>
        <button data-ritim="hizli">🔥 Hızlı</button>
    </div>

</div>

<script>

let audioContext = null;
let masterGain = null;
let vibrationEnabled = true;
let rhythmTimer = null;

const tuningNotes = {

    bozuk: [
        196.00,
        196.00,
        146.83,
        146.83,
        110.00,
        110.00,
        82.41
    ],

    baglama: [
        196.00,
        196.00,
        146.83,
        146.83,
        110.00,
        110.00,
        73.42
    ],

    kara: [
        220.00,
        220.00,
        164.81,
        164.81,
        110.00,
        110.00,
        82.41
    ]
};

let currentTuning = "bozuk";

const noteNames = [
    "SOL",
    "SOL",
    "RE",
    "RE",
    "LA",
    "LA",
    "Mİ"
];

function initAudio() {

    if (!audioContext) {

        audioContext =
            new (window.AudioContext ||
                 window.webkitAudioContext)();

        masterGain =
            audioContext.createGain();

        masterGain.gain.value = 0.75;

        masterGain.connect(audioContext.destination);
    }

    if (audioContext.state === "suspended") {
        audioContext.resume();
    }
}

function playString(index) {

    initAudio();

    const frequency =
        tuningNotes[currentTuning][index];

    const now = audioContext.currentTime;

    const oscillator =
        audioContext.createOscillator();

    const gain =
        audioContext.createGain();

    /*
       Bağlama hissi vermek için
       temel ses + harmonikler.
    */

    oscillator.type = "triangle";
    oscillator.frequency.setValueAtTime(
        frequency,
        now
    );

    gain.gain.setValueAtTime(
        0.0001,
        now
    );

    gain.gain.exponentialRampToValueAtTime(
        0.55,
        now + 0.008
    );

    gain.gain.exponentialRampToValueAtTime(
        0.20,
        now + 0.15
    );

    gain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 2.2
    );

    oscillator.connect(gain);
    gain.connect(masterGain);

    oscillator.start(now);
    oscillator.stop(now + 2.3);

    /*
       Hafif ikinci harmonik
    */

    const harmonic =
        audioContext.createOscillator();

    const harmonicGain =
        audioContext.createGain();

    harmonic.type = "sine";

    harmonic.frequency.setValueAtTime(
        frequency * 2,
        now
    );

    harmonicGain.gain.setValueAtTime(
        0.0001,
        now
    );

    harmonicGain.gain.exponentialRampToValueAtTime(
        0.13,
        now + 0.01
    );

    harmonicGain.gain.exponentialRampToValueAtTime(
        0.0001,
        now + 0.8
    );

    harmonic.connect(harmonicGain);
    harmonicGain.connect(masterGain);

    harmonic.start(now);
    harmonic.stop(now + 0.9);

    showNote(index);

    if (vibrationEnabled &&
        navigator.vibrate) {

        navigator.vibrate(15);
    }
}

function showNote(index) {

    const note =
        noteNames[index];

    document.getElementById(
        "lastNote"
    ).textContent = note;

    document.getElementById(
        "status"
    ).textContent =
        "Tel " + (index + 1) +
        " • " + note;

    const element =
        document.querySelector(
            '.string[data-string="' +
            index + '"]'
        );

    element.classList.add("hit");

    setTimeout(() => {
        element.classList.remove("hit");
    }, 120);
}

document.querySelectorAll(".string")
.forEach(string => {

    const index =
        Number(string.dataset.string);

    string.addEventListener(
        "pointerdown",
        function(e) {

            e.preventDefault();

            playString(index);
        }
    );
});

document.getElementById(
    "startBtn"
).addEventListener(
    "click",
    function() {

        initAudio();

        this.textContent =
            "🔊 Ses Açık";

        document.getElementById(
            "status"
        ).textContent =
            "Hazır! Tellerden birine dokun.";
    }
);

document.getElementById(
    "volume"
).addEventListener(
    "input",
    function() {

        if (masterGain) {

            masterGain.gain.value =
                Number(this.value) / 100;
        }
    }
);

document.getElementById(
    "tuning"
).addEventListener(
    "change",
    function() {

        currentTuning = this.value;

        document.getElementById(
            "status"
        ).textContent =
            "Akort: " +
            this.options[this.selectedIndex]
                .text;
    }
);

document.getElementById(
    "vibration"
).addEventListener(
    "click",
    function() {

        vibrationEnabled =
            !vibrationEnabled;

        this.textContent =
            vibrationEnabled
            ? "Açık"
            : "Kapalı";
    }
);

/*
   Perdeleri oluştur
*/

const fretContainer =
    document.getElementById("frets");

for (let i = 0; i < 13; i++) {

    const fret =
        document.createElement("div");

    fret.className = "fret";

    fret.style.left =
        (i / 13 * 100) + "%";

    fretContainer.appendChild(fret);
}

/*
   Basit ritim sistemi
*/

const rhythmSpeeds = {
    yavas: 700,
    orta: 500,
    hizli: 320
};

function stopRhythm() {

    if (rhythmTimer) {

        clearInterval(rhythmTimer);
        rhythmTimer = null;
    }

    document
        .querySelectorAll(".ritim-buttons button")
        .forEach(btn =>
            btn.classList.remove("active")
        );
}

function startRhythm(type, button) {

    stopRhythm();

    initAudio();

    button.classList.add("active");

    rhythmTimer =
        setInterval(() => {

            /*
              Basit ritim:
              alt tel - üst tel
            */

            playString(4);

            setTimeout(() => {
                playString(2);
            }, 150);

        }, rhythmSpeeds[type]);
}

document
    .querySelectorAll(
        ".ritim-buttons button"
    )
    .forEach(button => {

        button.addEventListener(
            "click",
            function() {

                const type =
                    this.dataset.ritim;

                startRhythm(
                    type,
                    this
                );
            }
        );
    });

document.getElementById(
    "ritim"
).addEventListener(
    "click",
    function() {

        if (rhythmTimer) {

            stopRhythm();

            this.textContent =
                "Kapalı";

        } else {

            initAudio();

            startRhythm(
                "orta",
                document.querySelector(
                    '[data-ritim="orta"]'
                )
            );

            this.textContent =
                "Açık";
        }
    }
);

</script>

</body>
</html>
